
name: Build OneUseBook

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle -p OneUseBook-Paper-26.2 build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: OneUseBook-Paper-26.2
          path: OneUseBook-Paper-26.2/build/libs/OneUseBook-1.0.0.jar
